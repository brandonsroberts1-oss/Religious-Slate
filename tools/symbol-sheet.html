<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Symbol library sheet</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }

  #sheet {
    width: 1500px;
    padding: 54px 58px 46px;
    background: linear-gradient(178deg, #f2ede4 0%, #e6ded2 100%);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #33302c;
  }

  header { margin-bottom: 30px; }
  header h1 { margin: 0 0 6px; font-size: 30px; font-weight: 500; letter-spacing: 0.01em; }
  header p { margin: 0; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #8a8177; }

  h2 {
    margin: 26px 0 12px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em;
    text-transform: uppercase; color: #a2743a;
    border-bottom: 1px solid #d3c8b8; padding-bottom: 6px;
  }

  .row { display: flex; flex-wrap: wrap; gap: 14px; }

  .item {
    width: 128px;
    padding: 14px 8px 10px;
    background: #fbf8f3;
    border: 1px solid #ded4c6;
    border-radius: 8px;
    text-align: center;
  }
  .item svg { display: block; width: 100%; height: 62px; margin-bottom: 9px; }
  .item span { font-size: 11px; color: #6d655c; line-height: 1.3; display: block; }
</style>
</head>
<body>
<div id="sheet">
  <header>
    <h1>Symbol library</h1>
    <p>Slate Plaque Studio · engrave-ready vector</p>
  </header>
  <div id="body"></div>
</div>

<script type="module">
import { SYMBOLS, SYMBOL_GROUPS, symbolViewBox } from '../assets/js/symbols.js';

const body = document.getElementById('body');
for (const group of SYMBOL_GROUPS) {
  const row = document.createElement('div');
  row.className = 'row';
  for (const s of SYMBOLS.filter((x) => x.group === group)) {
    // Rendered from the same geometry the laser receives.
    row.insertAdjacentHTML('beforeend',
      `<div class="item">
         <svg viewBox="${symbolViewBox(s.id)}"><path d="${s.d}" fill="#2f3337" fill-rule="nonzero"/></svg>
         <span>${s.name}</span>
       </div>`);
  }
  body.insertAdjacentHTML('beforeend', `<h2>${group}</h2>`);
  body.append(row);
}

window.__sheetReady = true;
</script>
</body>
</html>
